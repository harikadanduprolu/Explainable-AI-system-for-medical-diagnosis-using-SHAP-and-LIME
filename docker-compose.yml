# Docker Compose for Explainable Medical AI System
# Production deployment configuration
version: '3.8'

services:
  # Main FastAPI Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-ai-web
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=${WORKERS:-4}
    env_file:
      - .env
    volumes:
      - ./trained_models:/app/trained_models:ro
      - ./logs:/app/logs
      - ./audit_logs:/app/audit_logs
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - medical-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: medical-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - medical-ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: medical-ai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - medical-ai-network

  # PostgreSQL database (optional - for future use)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: medical-ai-db
  #   environment:
  #     POSTGRES_DB: medical_ai
  #     POSTGRES_USER: ${DB_USER:-medicalai}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped
  #   networks:
  #     - medical-ai-network

volumes:
  redis-data:
  # postgres-data:

networks:
  medical-ai-network:
    driver: bridge
